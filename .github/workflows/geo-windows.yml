name: Geo Windows build

on:
  push:
    branches: [geo, upstream-check]
    paths-ignore: [README.md]
  workflow_dispatch:

permissions:
  contents: write   # the release below
  issues: write     # a failed upstream trial build is reported as one

concurrency:
  group: geo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The survey math alone, in a minute: the Windows build waits on it.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: geo_core_test
        run: |
          g++ -std=c++17 -O1 -Wall -Isrc src/data/tests/geo_core_test.cpp \
            src/data/GeoCrs.cpp src/data/GeoProject.cpp src/data/GeoVectors.cpp -o geo_core_test
          ./geo_core_test

  windows:
    needs: core-tests
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -sSL -o vulkan_sdk.exe https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan_sdk.exe
          $p = Start-Process -FilePath .\vulkan_sdk.exe -NoNewWindow -Wait -PassThru `
               -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1

      # Every run starts from a clean checkout; sccache keeps the compiled
      # objects between runs, so only what a commit touched is rebuilt.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build
        shell: cmd
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          python tools\codegen\generate_headers.py
          python tools\codegen\generate_kernel_instantiation.py
          cmake -G Ninja -B build_vulkan -DCMAKE_BUILD_TYPE=Release -DSS_BACKEND=vulkan -DSS_ENABLE_PATENTED=ON -DSS_CHECK_UI_TEXT=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache || exit /b 1
          cmake --build build_vulkan --target spirula -j 4 || exit /b 1
          sccache --show-stats

      - name: Smoke
        shell: cmd
        run: build_vulkan\spirula.exe train --help

      - name: Package
        shell: pwsh
        run: |
          $sha = git rev-parse --short=7 HEAD
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build_vulkan\spirula.exe dist\spirula-geo.exe
          Copy-Item LICENSE dist\LICENSE.txt
          Copy-Item docs\geodesy.md dist\
          # ffmpeg beside the exe: the fallback when the GPU cannot decode a
          # video (iPhone HEVC on some drivers). Found first by SearchPath.
          try {
            curl.exe -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            Expand-Archive ff.zip -DestinationPath ff
            $bin = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            Copy-Item $bin.FullName dist\ffmpeg.exe
            $lic = Get-ChildItem ff -Recurse -Filter LICENSE.txt | Select-Object -First 1
            if ($lic) { Copy-Item $lic.FullName dist\ffmpeg-LICENSE.txt }
          } catch { Write-Warning "ffmpeg not bundled: $_" }
          Compress-Archive -Path dist\* -DestinationPath "spirula-geo-$sha-windows.zip"
          "ASSET=spirula-geo-$sha-windows.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: spirula-geo-windows
          path: ${{ env.ASSET }}
          retention-days: 30

      # A public download link that needs no GitHub sign-in; not for the
      # upstream trial merge.
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/geo'
        with:
          tag_name: geo-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: spirula-geo build ${{ github.run_number }}
          prerelease: true
          files: ${{ env.ASSET }}

      - name: Report a failed upstream trial
        if: failure() && github.ref == 'refs/heads/upstream-check'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Upstream trial build failed ($(date -u +%F))" \
            --body "The newest Spirula Studio merges into geo without conflicts but does not build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The hook points are listed in docs/fork.md."
